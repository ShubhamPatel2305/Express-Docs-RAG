services:
  - type: web
    name: your-fastapi-service
    env: python
    region: oregon  # or your preferred region
    plan: free  # or your plan
    runtime: python-3.10.7
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.7